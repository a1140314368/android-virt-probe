name: core-tests

on:
  push:
  pull_request:

jobs:
  virtprobe-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: JVM unit tests
        run: ./gradlew :virtprobe-core:test --no-daemon -Pvirtprobe.includeAndroid=false
